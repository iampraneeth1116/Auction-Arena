# Render Blueprint: New → Blueprint → pick this repo. Render creates the web
# service from this file and asks for every value marked sync: false.
services:
  - type: web
    name: auction-arena
    runtime: node
    plan: free
    # Build tools are devDependencies, and NODE_ENV=production would skip them
    buildCommand: npm ci --include=dev && npm run build && npm run db:deploy
    startCommand: npm start
    # Also checks the database answers
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # A fresh random secret for signing logins, made by Render
      - key: JWT_SECRET
        generateValue: true
      # Neon connection string (remove &channel_binding=require if it's there)
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Read at build time: GIF search runs in the browser
      - key: VITE_GIPHY_API_KEY
        sync: false
      # Optional: shown on the privacy page as the contact address
      - key: VITE_CONTACT_EMAIL
        sync: false
